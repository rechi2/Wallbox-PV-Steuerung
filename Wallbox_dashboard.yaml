              icon: mdi:battery-charging-high
      - type: conditional
        conditions:
          - entity: input_select.lademodus
            state: Manuell
        card:
          type: custom:button-card
          name: ' '
          show_icon: false
          show_name: false
          styles:
            card:
              - background: rgba(156,39,176,0.08)
              - border: 1px solid rgba(156,39,176,0.3)
              - border-radius: 16px
              - padding: 20px 16px
              - margin-top: 12px
            grid:
              - grid-template-areas: '"manual_info"'
              - grid-template-columns: 1fr
              - justify-items: center
          custom_fields:
            manual_info: |
              [[[
                const kw = parseFloat(states['input_number.wallbox_manuelle_leistung']?.state) || 1.4;
                const psm = states['select.goe_501900_psm']?.state;
                const phasen = psm === '1' ? 1 : 3;
                const amp = Math.min(16, Math.max(6, Math.round((kw * 1000) / (phasen * 230))));
                return `
                  <div style="text-align: center; width: 100%;">
                    <div style="color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;">🎛 Manueller Modus</div>
                    <div style="color: #9C27B0; font-size: 15px; font-weight: bold; margin-bottom: 4px;">
                      Manuelle Leistung: ${kw} kW
                    </div>
                    <div style="color: #888; font-size: 12px;">
                      → ${amp}A bei ${phasen}-phasig (${phasen}×230V)
                    </div>
                  </div>
                `;
              ]]]
          extra_styles: |
            #manual_info {
              width: 100%;
            }
      - type: conditional
        conditions:
          - entity: input_select.lademodus
            state: Manuell
        card:
          type: entities
          card_mod:
            style: |
              ha-card {
                background: rgba(156,39,176,0.08) !important;
                border: 1px solid rgba(156,39,176,0.3) !important;
                border-radius: 12px !important;
                margin-top: 8px !important;
              }
          entities:
            - entity: input_number.wallbox_manuelle_leistung
              name: Ladeleistung (kW)
              icon: mdi:speedometer
      - type: conditional
        conditions:
          - entity: input_select.lademodus
            state: Schnell
        card:
          type: custom:button-card
          name: ' '
          show_icon: false
          show_name: false
          styles:
            card:
              - background: rgba(33,150,243,0.08)
              - border: 1px solid rgba(33,150,243,0.3)
              - border-radius: 16px
              - padding: 20px 16px
              - margin-top: 12px
            grid:
              - grid-template-areas: '"fast_info"'
              - grid-template-columns: 1fr
              - justify-items: center
          custom_fields:
            fast_info: |
              [[[
                return `
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; width: 100%;">
                    <div style="color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;">⚡ Schnelllade Modus</div>
                    <span style="font-size: 28px;">⚡</span>
                    <div>
                      <div style="color: #2196F3; font-size: 16px; font-weight: bold;">Schnellladen aktiv</div>
                      <div style="color: #888; font-size: 13px;">3-phasig · 16A · max. 11 kW – unabhängig von PV</div>
                    </div>
                  </div>
                `;
              ]]]
          extra_styles: |
            #fast_info {
              width: 100%;
            }
      - type: custom:button-card
        name: ' '
        show_name: false
        show_icon: false
        styles:
          card:
            - background: rgba(255,255,255,0.03)
            - border: '1px solid #333'
            - border-radius: 16px 16px 0 0
            - padding: 16px 16px 8px 16px
            - margin-top: 12px
          grid:
            - grid-template-areas: '"log_header"'
            - grid-template-columns: 1fr
        custom_fields:
          log_header: |
            [[[
              const frc = states['select.goe_501900_frc']?.state;
              const modus = states['input_select.lademodus']?.state || '?';
              const amp = states['number.goe_501900_amp']?.state || '?';
              const psm = states['select.goe_501900_psm']?.state;
              const phasen = psm === '1' ? '1-ph' : '3-ph';
              const ueberschuss = parseFloat(states['sensor.verfuegbarer_pv_ueberschuss_geglaettet']?.state) || 0;
              const ziel = parseFloat(states['sensor.wallbox_ziel_uberschuss']?.state) || 0;
              const batt_soc = parseFloat(states['sensor.battery_soc']?.state) || 0;
              const prio_soc = parseFloat(states['input_number.batterie_priority_soc']?.state) || 80;
              
              const formatW = (w) => {
                if (Math.abs(w) >= 1000) return (w/1000).toFixed(1) + 'kW';
                return Math.round(w) + 'W';
              };
              
              const frcIcon = frc === '2' ? '🟢' : '🔴';
              const frcText = frc === '2' ? 'LADEN' : 'STOPP';
              
              let reason = '';
              if (frc !== '2' && modus === 'PV-Überschuss') {
                if (batt_soc < prio_soc) {
                  reason = '⚠️ Batterie unter Priorität (' + batt_soc.toFixed(0) + '% < ' + prio_soc.toFixed(0) + '%)';
                } else if (ueberschuss < 100) {
                  reason = '☁️ Zu wenig PV-Überschuss (' + formatW(ueberschuss) + ')';
                } else {
                  reason = '⏳ Warte auf Überschuss > 1.6kW für 2 Min';
                }
              } else if (frc !== '2' && modus === 'Kein Laden') {
                reason = '⏹ Manuell gestoppt';
              }
              
              return `
                <div style="width: 100%;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <span style="color: white; font-size: 16px; font-weight: bold;">📋 Wallbox Logbuch</span>
                    <span style="font-size: 13px;">${frcIcon} ${frcText}</span>
                  </div>
                  
                  <div style="color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; text-align: center; padding-bottom: 8px;">📈 Aktueller Status</div>
                  
                  <div style="
                    display: grid;
                    grid-template-columns: repeat(4, 1fr);
                    gap: 8px;
                    background: rgba(0,0,0,0.3);
                    border-radius: 8px;
                    padding: 10px;
                    margin-bottom: 8px;
                    font-size: 12px;
                    text-align: center;
                  ">
                    <div>
                      <div style="color: #666;">Modus</div>
                      <div style="color: #9C27B0; font-weight: bold;">${modus}</div>
                    </div>
                    <div>
                      <div style="color: #666;">Strom</div>
                      <div style="color: white; font-weight: bold;">${amp}A ${phasen}</div>
                    </div>
                    <div>
                      <div style="color: #666;">Überschuss</div>
                      <div style="color: #FFC107; font-weight: bold;">${formatW(ueberschuss)}</div>
                    </div>
                    <div>
                      <div style="color: #666;">Für Wallbox</div>
                      <div style="color: #4CAF50; font-weight: bold;">${formatW(ziel)}</div>
                    </div>
                  </div>
                  
                  ${reason ? `
                    <div style="
                      background: rgba(244,67,54,0.1);
                      border: 1px solid rgba(244,67,54,0.3);
                      border-radius: 8px;
                      padding: 8px 12px;
                      color: #FF9800;
                      font-size: 13px;
                      text-align: center;
                    ">${reason}</div>
                  ` : ''}
                </div>
              `;
            ]]]
      - type: iframe
        url: /local/wallbox_log_viewer.html
        aspect_ratio: 80%
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              border: 1px solid #333 !important;
              border-top: none !important;
